name: Frontend CI

on:
  pull_request:
  push:
    branches: [develop, develop_aws]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: docker build --build-arg VITE_API_BASE_URL="" -t frontend:${{ github.sha }} .
